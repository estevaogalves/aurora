# Mantém atualizado o que está fixado por SHA/digest (ações, imagens) e as dependências de código.
# Cada atualização vira um pull request que passa pela CI (incluindo pnpm audit e govulncheck).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # atualizações menores e de correção juntas, para não gerar um PR por pacote
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
