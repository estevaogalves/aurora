name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerabilidades novas aparecem sem nenhum commit: toda segunda a CI roda de novo a verificação de segurança.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O token do workflow só lê o repositório. Nenhum job precisa de mais que isso.
permissions:
  contents: read

# Ações fixadas pelo SHA do commit (o comentário diz a versão). Tags podem ser movidas para outro código;
# o SHA não. O Dependabot (.github/dependabot.yml) propõe as atualizações.
jobs:
  web:
    name: Front (lint, tipos, testes, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tipos gerados precisam estar em dia com docs/openapi.yaml
      - run: pnpm --filter @aurora/api-types check
      - run: pnpm lint
      - run: pnpm --filter web exec tsc -b
      - run: pnpm test
      - run: pnpm build

  api:
    name: API (vet, testes, sqlc)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: aurora
          # banco descartável do CI, só alcançável de dentro do job
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aurora:aurora@localhost:5432/aurora_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - run: go test ./...
      # o código gerado em internal/store/sqlcgen precisa bater com as queries e migrations
      - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4.0.0
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff

  # Dependências com vulnerabilidade conhecida quebram a CI (e rodam toda semana, mesmo sem commits).
  security:
    name: Segurança (pnpm audit, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # falha com vulnerabilidade ALTA ou CRÍTICA, em produção e em desenvolvimento (lê só o pnpm-lock.yaml)
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # versão da ferramenta fixada; ela só falha se o código CHAMA a função vulnerável
      - name: govulncheck
        working-directory: apps/api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
