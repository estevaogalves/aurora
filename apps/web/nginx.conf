server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # A API fica atrás do mesmo endereço do front: sem CORS e com o cookie de refresh no mesmo site.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        # a API também envia estes dois; o nginx é quem define, para não duplicar
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri /index.html;
    }
}
