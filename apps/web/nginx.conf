server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # IP real do cliente quando há CDN/balanceador na frente (vazio por padrão). Veja
    # docs/ip-real-atras-de-proxy.md. Ele ajusta $remote_addr, que é o que a API recebe abaixo.
    include /etc/nginx/snippets/real-ip.conf;

    # A API fica atrás do mesmo endereço do front: sem CORS e com o cookie de refresh no mesmo site.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # O nginx é a única fonte do IP do cliente: SOBRESCREVE (não acrescenta) estes cabeçalhos, senão
        # um cliente enviaria os dele e escaparia dos limites por IP (login, cadastro). A API usa
        # TRUST_PROXY=true para ler X-Real-IP; True-Client-IP e Forwarded são descartados.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        # a API também envia estes dois; o nginx é quem define, para não duplicar
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker e manifest: o navegador precisa revalidar sempre, senão as atualizações não chegam.
    location ~ ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri /index.html;
    }
}
