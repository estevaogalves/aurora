# Cabeçalhos de segurança, incluídos em cada bloco que usa add_header (o nginx não herda add_header
# do nível superior quando o bloco define o seu). `always` os mantém também em respostas de erro.
#
# CSP em modo ENFORCE: o navegador bloqueia o que a política não permite (violações aparecem no console, F12).
# O hash sha256 é o do script inline do tema em index.html; se esse script mudar, atualize o hash
# (o teste src/security/csp.test.ts avisa).
# style-src com 'unsafe-inline': o React e os gráficos usam o atributo style=.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-7OjMbFA+pIJPphnofeNJb76WFivVU7M6LbfQc3DjO3A='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Demais cabeçalhos:
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Só tem efeito quando o acesso chega por HTTPS (o navegador ignora em HTTP); vale a pena já deixar pronto.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
