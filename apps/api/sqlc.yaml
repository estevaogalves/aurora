version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/store/sqlcgen"
        emit_json_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
          - db_type: "jsontext"
            go_type: "aurora/api/internal/sqlitetypes.JSON"
          - db_type: "jsontext"
            nullable: true
            go_type: "aurora/api/internal/sqlitetypes.JSON"
          - db_type: "textlist"
            go_type: "aurora/api/internal/sqlitetypes.TextList"
