openapi: 3.0.3
info:
  title: Aurora API
  version: 1.0.0
  description: |
    API do Aurora (controle financeiro pessoal). Contrato da Fase 7.

    - Todo dinheiro é em **centavos inteiros**. Meses são `"AAAA-MM"`.
    - O JSON de `/data` e dos recursos segue o `FinanceData` do front.
    - O token de acesso (JWT) vai no cabeçalho `Authorization: Bearer ...`; o refresh token
      fica num cookie `httpOnly` (`aurora_refresh`, path `/api/v1/auth`).
    - Nas criações, o cliente pode enviar o `id` (UUID). Se vier ausente ou inválido, o servidor gera um.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Cria a conta e abre a sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Conta criada, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      summary: Entra com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Sessão aberta, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: Muitas tentativas de login
          headers:
            Retry-After: { schema: { type: integer }, description: Segundos até poder tentar de novo }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Troca o refresh token (cookie) por um par novo
      security: []
      responses:
        "200": { description: Sessão renovada, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Encerra a sessão e limpa o cookie
      security: []
      responses:
        "204": { description: Sessão encerrada }
  /me:
    get:
      tags: [auth]
      summary: Usuário logado
      responses:
        "200": { description: Usuário, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Exclui a conta e todos os dados (LGPD). Exige a senha.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        "204": { description: Conta excluída; sessões encerradas }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/export:
    get:
      tags: [auth]
      summary: Exporta todos os dados da conta em JSON (LGPD)
      responses:
        "200": { description: Dados cadastrais e financeiros do titular, content: { application/json: { schema: { type: object, required: [exportedAt, user, data], properties: { exportedAt: { type: string, format: date-time }, user: { $ref: "#/components/schemas/User" }, data: { $ref: "#/components/schemas/FinanceData" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      tags: [auth]
      summary: Lista os usuários (só admin)
      responses:
        "200": { description: Usuários, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { $ref: "#/components/responses/Error" }

  /data:
    get:
      tags: [dados]
      summary: Tudo o que o usuário guarda
      responses:
        "200": { description: Dados, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceData" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /import:
    post:
      tags: [dados]
      summary: Importa os dados do localStorage
      description: Sem `replace=true`, responde 409 se a conta já tem dados.
      parameters:
        - { name: replace, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceData" }
      responses:
        "201": { description: Dados gravados, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceData" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /transactions:
    post:
      tags: [lançamentos]
      summary: Cria renda ou despesa
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /transactions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [lançamentos]
      summary: Altera só os campos enviados
      description: "`hiddenMonths`, `monthlyValues` e `monthlyNotes`, quando enviados, substituem a lista/mapa inteiro."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransactionPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lançamentos]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /credits:
    post:
      tags: [crédito]
      summary: Cria compra no crédito
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /credits/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [crédito]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /credit-cards:
    post:
      tags: [crédito]
      summary: Cadastra um cartão de crédito
      description: Só nome e dias de fechamento e vencimento. Nada sensível (sem número, CVV nem CPF).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /credit-cards/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [crédito]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditCardPatch" } } }
      responses:
        "200": { description: Atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Remove o cartão
      description: As compras ligadas a ele ficam sem cartão (voltam a valer no mês da cobrança); nenhuma compra é apagada.
      responses:
        "204": { description: Removido }
        "404": { $ref: "#/components/responses/Error" }

  /investments:
    post:
      tags: [investimentos]
      summary: Cadastra um investimento
      description: |
        Controle manual do que está investido, sem integração com banco ou corretora. Fica **separado do fluxo
        de caixa**: não entra em receitas, despesas, saldo, projeção nem relatórios.
        O valor atual (`currentValue`) é o informado aqui; depois, cada movimentação o refaz no servidor.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Investment" } } }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { $ref: "#/components/schemas/Investment" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /investments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [investimentos]
      summary: Altera só os campos enviados
      description: |
        Texto vazio limpa um campo opcional. `"quantity": null` e `"avgPrice": null` limpam cotas e preço médio;
        sem a chave, não mudam. Para mexer no valor por movimentação, use `/investment-movements`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InvestmentPatch" } } }
      responses:
        "200": { description: Atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Investment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [investimentos]
      summary: Remove o investimento e as movimentações dele
      responses:
        "204": { description: Removido }
        "404": { $ref: "#/components/responses/Error" }

  /investment-movements:
    post:
      tags: [investimentos]
      summary: Registra uma movimentação (aporte, resgate, rendimento ou atualização de valor)
      description: |
        O servidor refaz valor atual, cotas e preço médio do investimento pelas movimentações, em ordem de data,
        na mesma transação, e devolve o investimento atualizado. O valor atual nunca fica negativo.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InvestmentMovement" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/InvestmentMovementResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /investment-movements/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [investimentos]
      summary: Corrige a movimentação e refaz o investimento
      description: '`"quantity": null` e `"unitPrice": null` limpam os campos; sem a chave, não mudam.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InvestmentMovementPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/InvestmentMovementResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [investimentos]
      summary: Exclui a movimentação e refaz o investimento
      responses:
        "200": { description: Excluída (devolve só o investimento refeito), content: { application/json: { schema: { $ref: "#/components/schemas/InvestmentMovementResult" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /goal-movements:
    post:
      tags: [metas]
      summary: Registra uma movimentação de meta ou porquinho (aporte, retirada, rendimento ou ajuste)
      description: |
        O servidor refaz o guardado e o total de rendimentos da meta pelas movimentações, em ordem de data, na mesma
        transação, e devolve a meta atualizada. O guardado nunca fica negativo.
        A `origin` é vazia (lançado à mão) ou `distribution|AAAA-MM|fonte|fatia` (enviado pela sugestão do saldo).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GoalMovement" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/GoalMovementResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /goal-movements/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [metas]
      summary: Corrige a movimentação e refaz a meta
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GoalMovementPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/GoalMovementResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [metas]
      summary: Exclui a movimentação e refaz a meta
      responses:
        "200": { description: Excluída (devolve só a meta refeita), content: { application/json: { schema: { $ref: "#/components/schemas/GoalMovementResult" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /credits/{id}/installments/{n}/advance:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/InstallmentNumber" }
    post:
      tags: [crédito]
      summary: Adianta a última parcela da compra
      description: |
        Só a última parcela ainda não adiantada (nem excluída), e só se cair depois do mês atual.
        O valor da parcela menos o desconto passa a ser cobrado no mês atual e a parcela deixa o mês original.
        O desconto vai de zero até menos que o valor da parcela. Quem valida é o servidor.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [discount], properties: { discount: { $ref: "#/components/schemas/Cents" } } } } }
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /credits/{id}/installments/{n}/value:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/InstallmentNumber" }
    delete:
      tags: [crédito]
      summary: Tira o valor real de um mês de recorrência variável
      description: O mês volta ao valor estimado. Só recorrências de valor variável.
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /credits/{id}/installments/{n}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/InstallmentNumber" }
    put:
      tags: [crédito]
      summary: Muda só o valor de uma parcela
      description: Parcelas adiantadas ou excluídas não podem ser alteradas. Em recorrência de valor variável, define o valor real daquele mês (n é o mês contado desde o início).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [value], properties: { value: { $ref: "#/components/schemas/Cents" } } } } }
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Exclui só uma parcela
      description: As outras parcelas mantêm número e mês. Parcelas adiantadas não podem ser excluídas.
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

    post:
      tags: [metas]
      summary: Cria meta
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /goals/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [metas]
      summary: Altera só os campos enviados
      description: '`"deadline": null` limpa o prazo; sem a chave, o prazo não muda.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GoalPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [metas]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /credit-cards/{id}/payments/{month}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/PaymentMonth" }
    put:
      tags: [crédito]
      summary: Marca a fatura do cartão como paga (ou edita o pagamento)
      description: O mês é o do vencimento da fatura. Só registro para consulta; não muda nenhum valor, resumo, projeção ou comparação. Forma, data e observação como no pagamento de despesas (só boleto pode ter data futura).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
      responses:
        "200": { description: Cartão atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Desmarca o pagamento da fatura deste mês
      responses:
        "200": { description: Cartão atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /credit-cards/{id}/adjustments/{month}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/PaymentMonth" }
    put:
      tags: [crédito]
      summary: Troca a lista de ajustes (descontos e acréscimos) da fatura do cartão
      description: O mês é o do vencimento da fatura. O corpo é a lista inteira de ajustes do mês (até 50; lista vazia remove todos). Cada ajuste tem id único, valor em centavos diferente de zero (negativo é desconto, positivo é acréscimo) e observação opcional. Só registro para a fatura bater com a do banco; não muda nenhuma despesa, projeção ou comparação.
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/InvoiceAdjustment" } } } }
      responses:
        "200": { description: Cartão atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Remove todos os ajustes da fatura deste mês
      responses:
        "200": { description: Cartão atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /transactions/{id}/payments/{month}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/PaymentMonth" }
    put:
      tags: [lançamentos]
      summary: Marca a despesa como paga neste mês (ou edita o pagamento)
      description: Só registro para consulta e relatórios; não muda nenhum valor, resumo, projeção ou comparação. Despesa avulsa só vale no próprio mês; fixa, do mês inicial em diante. Renda não tem pagamento.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
      responses:
        "200": { description: Lançamento atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lançamentos]
      summary: Desmarca o pagamento deste mês
      responses:
        "200": { description: Lançamento atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /extra-expenses/{id}/payment:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [projeção]
      summary: Marca a despesa extra como paga (ou edita o pagamento)
      description: Só registro para consulta e relatórios; não muda nenhum valor.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
      responses:
        "200": { description: Despesa extra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projeção]
      summary: Desmarca o pagamento
      responses:
        "200": { description: Despesa extra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /extra-expenses:
    post:
      tags: [projeção]
      summary: Cria despesa extra planejada
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /extra-expenses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [projeção]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpensePatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projeção]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /notes:
    post:
      tags: [anotações]
      summary: Cria anotação
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [anotações]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotePatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [anotações]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /categories:
    post:
      tags: [configurações]
      summary: Cria categoria própria
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomCategory" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/CustomCategory" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /categories/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [configurações]
      summary: Edita o nome e/ou a cor de uma categoria própria
      description: Os lançamentos guardam a categoria pelo nome, então ao trocar o nome as despesas e as compras no crédito que usavam o nome antigo passam para o novo, tudo de uma vez. Trocar só a caixa das letras é permitido; nome igual ao de outra categoria (sem diferenciar maiúsculas) é recusado e nada muda.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomCategoryPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CustomCategory" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [configurações]
      summary: Remove categoria própria
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }
  /settings/distribution:
    put:
      tags: [configurações]
      summary: Define a distribuição do saldo
      description: "`items: null` volta ao padrão."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  nullable: true
                  items: { $ref: "#/components/schemas/DistributionItem" }
      responses:
        "204": { description: Salvo }
        "400": { $ref: "#/components/responses/Error" }
  /settings/seen-alerts:
    put:
      tags: [configurações]
      summary: Lista completa dos avisos de meta já vistos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, maxItems: 1000, items: { type: string } }
      responses:
        "204": { description: Salvo }
        "400": { $ref: "#/components/responses/Error" }

  /settings/onboarding/{screen}:
    put:
      tags: [configurações]
      summary: Registra a resposta do usuário ao tour de uma tela
      description: Muda só a tela informada; as outras respostas ficam como estão.
      parameters:
        - { name: screen, in: path, required: true, description: "Identificador da tela, ex. painel", schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: "#/components/schemas/OnboardingState" }
      responses:
        "204": { description: Salvo }
        "400": { $ref: "#/components/responses/Error" }

  /summary/{month}:
    get:
      tags: [relatórios]
      summary: Resumo do mês
      description: "Fica em cache no Redis; o cabeçalho `X-Cache` mostra HIT ou MISS."
      parameters:
        - { name: month, in: path, required: true, schema: { $ref: "#/components/schemas/Month" } }
      responses:
        "200":
          description: Resumo
          headers:
            X-Cache: { schema: { type: string, enum: [HIT, MISS] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/MonthSummary" } } }
        "400": { $ref: "#/components/responses/Error" }
  /projection:
    get:
      tags: [relatórios]
      summary: Projeção mês a mês
      parameters:
        - { name: start, in: query, description: "Padrão: mês atual", schema: { $ref: "#/components/schemas/Month" } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
      responses:
        "200": { description: Projeção, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectionMonth" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /comparison:
    get:
      tags: [relatórios]
      summary: Compara de 2 a 12 meses
      parameters:
        - { name: months, in: query, required: true, description: "Meses separados por vírgula", schema: { type: string, example: "2026-01,2026-02" } }
      responses:
        "200": { description: Comparação, content: { application/json: { schema: { $ref: "#/components/schemas/Comparison" } } } }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentMonth: { name: month, in: path, required: true, description: Mês do pagamento (AAAA-MM), schema: { $ref: "#/components/schemas/Month" } }
    InstallmentNumber: { name: n, in: path, required: true, description: Posição da parcela na compra (1 a N), schema: { type: integer, minimum: 1, maximum: 360 } }

  responses:
    Error:
      description: Erro
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Mensagem pronta para exibir }
    Month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-03" }
    Cents: { type: integer, format: int64, minimum: 0, description: Valor em centavos }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
    Session:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    Transaction:
      type: object
      required: [name, amount, type, category, month]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        notes: { type: string, maxLength: 500 }
        fixed: { type: boolean }
        month: { $ref: "#/components/schemas/Month" }
        hiddenMonths: { type: array, items: { $ref: "#/components/schemas/Month" } }
        monthlyValues: { type: object, additionalProperties: { $ref: "#/components/schemas/Cents" } }
        monthlyNotes: { type: object, description: "Fixas: observação de um mês (só vale nele; `notes` vale no mês de criação).", additionalProperties: { type: string } }
        variableAmount: { type: boolean, description: "Só fixas: `amount` é uma estimativa; o valor real de um mês é o seu `monthlyValues`. Em transação avulsa é ignorado." }
        payments:
          type: object
          description: Pagamento por mês (AAAA-MM). Só despesas. Só registro, não entra em nenhuma conta. Na criação o servidor ignora; entra na importação.
          additionalProperties: { $ref: "#/components/schemas/Payment" }
        cardId: { type: string, format: uuid, description: "Cartão da despesa. Só despesa avulsa (não fixa, não renda). Com cartão, o valor entra no mês do vencimento da fatura, a partir de `purchaseDate`; `month` e `purchaseDate` ficam como foram lançados. Exige `purchaseDate`." }
        purchaseDate: { type: string, format: date, description: "Dia da compra no cartão (AAAA-MM-DD). Fica no histórico mesmo depois que o cartão é removido." }
        endMonth: { $ref: "#/components/schemas/Month", description: "Só fixas. Fixa encerrada: o último mês em que vale (\"2026-11\" = vale até novembro). Ausente = segue valendo. Os meses anteriores, os valores por mês e os pagamentos não mudam." }
        separate: { type: boolean, description: "Só renda não fixa (13º, bônus): a sugestão do saldo ganha uma fonte própria para ela. Só marca: não muda nenhum valor, saldo, projeção ou relatório." }
    Payment:
      type: object
      required: [method, date]
      properties:
        method: { type: string, enum: [pix, debit, credit, boleto] }
        date: { type: string, format: date, description: "Dia do pagamento (AAAA-MM-DD). Só boleto pode ter data futura (pagamento agendado); Pix e cartão com data futura são recusados." }
        notes: { type: string, maxLength: 500 }
    TransactionPatch:
      type: object
      properties:
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        category: { type: string }
        notes: { type: string }
        fixed: { type: boolean }
        hiddenMonths: { type: array, items: { $ref: "#/components/schemas/Month" } }
        monthlyValues: { type: object, additionalProperties: { $ref: "#/components/schemas/Cents" } }
        monthlyNotes: { type: object, description: "Fixas: observação de um mês (só vale nele; `notes` vale no mês de criação).", additionalProperties: { type: string } }
        variableAmount: { type: boolean, description: "Só fixas: `amount` é uma estimativa; o valor real de um mês é o seu `monthlyValues`. Em transação avulsa é ignorado." }
        cardId: { type: string, description: 'Despesa avulsa no cartão. `""` solta a despesa do cartão; sem a chave, não muda. Com cartão, a despesa tem que ter `purchaseDate` (no mesmo pedido ou já guardado) e não pode ser fixa.' }
        purchaseDate: { type: string, description: "Dia da compra no cartão (AAAA-MM-DD). Fica no histórico mesmo depois que o cartão é removido." }
        endMonth: { type: string, description: 'Só fixas: último mês em que vale (encerrar a partir do mês seguinte). `""` tira o fim (reativa); sem a chave, não muda. Não pode ser antes do mês em que a fixa começa.' }
        separate: { type: boolean, description: "Só renda não fixa: marca ou desmarca \"distribuir separado\" (13º, bônus). Despesa ou renda fixa marcada é recusada (422)." }

    CreditTransaction:
      type: object
      required: [name, totalAmount, installments, startMonth, category]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        totalAmount: { $ref: "#/components/schemas/Cents" }
        installments: { type: integer, minimum: 1, maximum: 360 }
        startMonth: { $ref: "#/components/schemas/Month" }
        category: { type: string }
        adjustments:
          type: object
          description: Ajustes por parcela, pela posição ("1" a "N"). Só leitura na criação (o servidor ignora); entra na importação.
          additionalProperties: { $ref: "#/components/schemas/InstallmentAdjustment" }
        recurring:
          type: boolean
          description: Compra recorrente (assinatura no cartão). totalAmount é o valor cobrado todo mês a partir de startMonth; installments fica em 1.
        endMonth:
          $ref: "#/components/schemas/Month"
          description: Último mês cobrado de uma recorrente cancelada. Só leitura na criação (o servidor ignora); entra na importação.
        billingDay: { type: integer, minimum: 1, maximum: 31, description: Dia da cobrança. Com cartão, define em qual fatura a cobrança cai. }
        cardId:
          type: string
          format: uuid
          description: Cartão da compra. Com cartão, o valor entra no mês do vencimento da fatura; sem, no mês da cobrança.
        variableAmount:
          type: boolean
          description: Só recorrentes. totalAmount é uma estimativa; o valor real de cada mês fica em adjustments["n"].value.
    CreditCard:
      type: object
      required: [name, closingDay, dueDay]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        limit: { $ref: "#/components/schemas/Cents", description: "Teto mensal da fatura. Ausente ou 0 = sem teto. Só acompanhamento, não bloqueia nada." }
        payments:
          type: object
          description: Pagamento da fatura por mês de vencimento (AAAA-MM). Só registro, não entra em nenhuma conta. Na criação o servidor ignora (use o endpoint próprio); entra na importação.
          additionalProperties: { $ref: "#/components/schemas/Payment" }
        adjustments:
          type: object
          description: Ajustes (descontos e acréscimos) da fatura por mês de vencimento (AAAA-MM), vários por fatura. Só registro, não entram em nenhuma conta. Na criação o servidor ignora (use o endpoint próprio); entra na importação.
          additionalProperties: { type: array, items: { $ref: "#/components/schemas/InvoiceAdjustment" } }
    InvoiceAdjustment:
      type: object
      required: [id, amount]
      properties:
        id: { type: string, maxLength: 64, description: "Identifica o ajuste dentro da fatura; único no mês." }
        amount: { type: integer, format: int64, description: "Centavos, diferente de zero. Negativo = desconto; positivo = acréscimo." }
        note: { type: string, maxLength: 200 }
    CreditCardPatch:
      type: object
      properties:
        name: { type: string }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        limit: { $ref: "#/components/schemas/Cents", description: "Teto mensal da fatura (0 tira o teto)." }
    InvestmentFamily:
      type: string
      enum: [fixed, treasury, liquid, equity, fund, other]
      description: Renda fixa, Tesouro, liquidez diária, ações/FIIs/ETFs, fundos e outros.
    Investment:
      type: object
      required: [name, family, institution, appliedAt, currentValue]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        family: { $ref: "#/components/schemas/InvestmentFamily" }
        product: { type: string, maxLength: 60, description: Produto dentro da família (CDB, FII, Tesouro Selic...) }
        institution: { type: string, description: Banco, corretora ou plataforma }
        appliedAt: { type: string, format: date, description: Data da primeira aplicação }
        currentValue: { $ref: "#/components/schemas/Cents", description: Quanto vale hoje. Máximo R$ 1 bilhão. }
        maturityDate: { type: string, format: date, description: Vencimento (vazio = não tem) }
        indexer: { type: string, maxLength: 40 }
        rate: { type: string, maxLength: 80, description: 'Taxa contratada, ex.: "110% do CDI"' }
        liquidity: { type: string, maxLength: 80 }
        graceUntil: { type: string, format: date, description: Carência até esta data }
        earlyRedeem: { type: boolean }
        quantity: { type: number, minimum: 0, description: Cotas (fracionário, até 6 casas). Ausente = não controla quantidade. }
        avgPrice: { $ref: "#/components/schemas/Cents", description: Preço médio por cota }
        redeemDays: { type: integer, minimum: 0, maximum: 3650 }
        ticker: { type: string, maxLength: 40 }
        fees: { type: string }
        notes: { type: string }
    InvestmentPatch:
      type: object
      properties:
        name: { type: string }
        family: { $ref: "#/components/schemas/InvestmentFamily" }
        product: { type: string }
        institution: { type: string }
        appliedAt: { type: string, format: date }
        currentValue: { $ref: "#/components/schemas/Cents" }
        maturityDate: { type: string }
        indexer: { type: string }
        rate: { type: string }
        liquidity: { type: string }
        graceUntil: { type: string }
        earlyRedeem: { type: boolean }
        quantity: { type: number, nullable: true, minimum: 0 }
        avgPrice: { type: integer, format: int64, nullable: true, minimum: 0 }
        redeemDays: { type: integer, minimum: 0, maximum: 3650 }
        ticker: { type: string }
        fees: { type: string }
        notes: { type: string }
    InvestmentMovementType:
      type: string
      enum: [contribution, redemption, yield, adjustment]
      description: |
        `contribution` (aporte) e `redemption` (resgate) mexem no dinheiro que entra e sai; `yield` (rendimento)
        soma ao valor atual sem ser aporte; `adjustment` (atualização de valor) define o novo valor atual.
    InvestmentMovement:
      type: object
      required: [investmentId, type, date, amount]
      properties:
        id: { type: string, format: uuid }
        investmentId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/InvestmentMovementType" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Cents", description: Valor total da movimentação (no ajuste, o novo valor atual) }
        quantity: { type: number, minimum: 0, description: Cotas compradas (aporte) ou vendidas (resgate) }
        unitPrice: { $ref: "#/components/schemas/Cents", description: Preço por cota nesta movimentação }
        note: { type: string, maxLength: 200, description: Observação livre }
        origin: { type: string, description: "Vazio = lançado à mão; `distribution|AAAA-MM|fonte|fatia` = enviado pela sugestão do saldo" }
    InvestmentMovementPatch:
      type: object
      properties:
        type: { $ref: "#/components/schemas/InvestmentMovementType" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Cents" }
        quantity: { type: number, nullable: true, minimum: 0 }
        unitPrice: { type: integer, format: int64, nullable: true, minimum: 0 }
        note: { type: string, maxLength: 200 }
        origin: { type: string }
    InvestmentMovementResult:
      type: object
      required: [investment]
      properties:
        movement: { $ref: "#/components/schemas/InvestmentMovement" }
        investment: { $ref: "#/components/schemas/Investment" }
    InstallmentAdjustment:
      type: object
      properties:
        value: { $ref: "#/components/schemas/Cents", description: Valor só desta parcela }
        removed: { type: boolean, description: Só esta parcela foi excluída }
        advanced:
          type: object
          required: [month, discount, amount]
          properties:
            month: { $ref: "#/components/schemas/Month", description: Mês em que o valor adiantado é cobrado }
            discount: { $ref: "#/components/schemas/Cents" }
            amount: { $ref: "#/components/schemas/Cents", description: Valor da parcela menos o desconto }
    CreditPatch:
      type: object
      properties:
        name: { type: string }
        totalAmount: { $ref: "#/components/schemas/Cents" }
        installments: { type: integer, minimum: 1, maximum: 360 }
        startMonth: { $ref: "#/components/schemas/Month" }
        category: { type: string }
        endMonth:
          $ref: "#/components/schemas/Month"
          description: Cancela a recorrência (só compras recorrentes). É o último mês cobrado; o servidor nunca o põe antes do mês atual.
        billingDay: { type: integer, minimum: 1, maximum: 31 }
        cardId: { type: string, description: 'Troca o cartão; "" solta a compra do cartão.' }
        variableAmount: { type: boolean }

    Goal:
      type: object
      required: [name, target, saved, monthly, deadline]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        target: { $ref: "#/components/schemas/Cents" }
        saved: { $ref: "#/components/schemas/Cents" }
        monthly: { $ref: "#/components/schemas/Cents" }
        deadline: { allOf: [{ $ref: "#/components/schemas/Month" }], nullable: true }
        yieldTotal: { $ref: "#/components/schemas/Cents" }
        piggy:
          type: boolean
          description: Porquinho. Não exige valor de meta (target pode ser 0); meta comum exige target maior que zero. Não muda depois de criado.
    GoalPatch:
      type: object
      description: |
        `saved` (clientes antigos) vira um ajuste no histórico da meta; `yieldTotal` é ignorado, porque o total de
        rendimentos é derivado das movimentações (use `/goal-movements`).
      properties:
        name: { type: string }
        target: { $ref: "#/components/schemas/Cents" }
        saved: { $ref: "#/components/schemas/Cents" }
        monthly: { $ref: "#/components/schemas/Cents" }
        yieldTotal: { $ref: "#/components/schemas/Cents" }
        deadline: { allOf: [{ $ref: "#/components/schemas/Month" }], nullable: true }
    GoalMovementType:
      type: string
      enum: [contribution, withdrawal, yield, adjustment]
      description: Aporte soma; retirada subtrai (nunca abaixo de zero); rendimento soma ao guardado e ao total de rendimentos; ajuste define o novo guardado (`amount` é o valor, não a diferença).
    GoalMovement:
      type: object
      required: [goalId, type, date, amount]
      properties:
        id: { type: string, format: uuid }
        goalId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/GoalMovementType" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Cents" }
        note: { type: string, maxLength: 200 }
        origin: { type: string, description: "Vazio = lançado à mão; `distribution|AAAA-MM|fonte|fatia` = enviado pela sugestão do saldo" }
    GoalMovementPatch:
      type: object
      properties:
        type: { $ref: "#/components/schemas/GoalMovementType" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Cents" }
        note: { type: string, maxLength: 200 }
        origin: { type: string }
    GoalMovementResult:
      type: object
      required: [goal]
      properties:
        movement: { $ref: "#/components/schemas/GoalMovement" }
        goal: { $ref: "#/components/schemas/Goal" }

    ExtraExpense:
      type: object
      required: [name, amount, month]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        month: { $ref: "#/components/schemas/Month" }
        payment: { $ref: "#/components/schemas/Payment", description: Pagamento da despesa (só registro). Na criação o servidor ignora; entra na importação. }
        cardId: { type: string, format: uuid, description: "Cartão da despesa. Só despesa avulsa (não fixa, não renda). Com cartão, o valor entra no mês do vencimento da fatura, a partir de `purchaseDate`; `month` e `purchaseDate` ficam como foram lançados. Exige `purchaseDate`." }
        purchaseDate: { type: string, format: date, description: "Dia da compra no cartão (AAAA-MM-DD). Fica no histórico mesmo depois que o cartão é removido." }
    ExtraExpensePatch:
      type: object
      properties:
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        month: { $ref: "#/components/schemas/Month" }
        cardId: { type: string, description: 'Despesa extra no cartão. `""` solta a despesa do cartão; sem a chave, não muda. Com cartão, tem que ter `purchaseDate`.' }
        purchaseDate: { type: string, description: "Dia da compra no cartão (AAAA-MM-DD). Fica no histórico mesmo depois que o cartão é removido." }

    Note:
      type: object
      required: [content, date, pinned, month]
      properties:
        id: { type: string, format: uuid }
        content: { type: string, maxLength: 2000 }
        date: { type: string }
        pinned: { type: boolean }
        month: { $ref: "#/components/schemas/Month" }
    NotePatch:
      type: object
      properties:
        content: { type: string }
        date: { type: string }
        pinned: { type: boolean }
        month: { $ref: "#/components/schemas/Month" }

    CustomCategory:
      type: object
      required: [name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    CustomCategoryPatch:
      type: object
      properties:
        name: { type: string }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }

    DistributionItem:
      type: object
      required: [id, label, percent]
      properties:
        id: { type: string }
        label: { type: string }
        percent: { type: integer, minimum: 0, maximum: 100 }
        custom: { type: boolean }

    OnboardingState:
      type: string
      enum: [done, dismissed]
      description: "done = viu o tour até o fim; dismissed = recusou o convite, fechou ou pulou"
    FinanceData:
      type: object
      required: [transactions, creditTransactions, notes, goals, extraExpenses, customCategories, distribution, seenAlerts, onboarding]
      properties:
        transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        creditTransactions: { type: array, items: { $ref: "#/components/schemas/CreditTransaction" } }
        creditCards: { type: array, items: { $ref: "#/components/schemas/CreditCard" } }
        notes: { type: array, items: { $ref: "#/components/schemas/Note" } }
        goals: { type: array, items: { $ref: "#/components/schemas/Goal" } }
        investments: { type: array, items: { $ref: "#/components/schemas/Investment" } }
        goalMovements: { type: array, items: { $ref: "#/components/schemas/GoalMovement" } }
        investmentMovements: { type: array, items: { $ref: "#/components/schemas/InvestmentMovement" } }
        extraExpenses: { type: array, items: { $ref: "#/components/schemas/ExtraExpense" } }
        customCategories: { type: array, items: { $ref: "#/components/schemas/CustomCategory" } }
        distribution:
          type: array
          nullable: true
          description: Percentuais escolhidos; null = padrão
          items: { $ref: "#/components/schemas/DistributionItem" }
        seenAlerts: { type: array, items: { type: string } }
        onboarding:
          type: object
          description: Resposta ao tour de cada tela (chave = tela). Tela ausente = ainda não convidado.
          additionalProperties: { $ref: "#/components/schemas/OnboardingState" }

    MonthSummary:
      type: object
      required: [month, totalIncome, totalExpense, creditExpense, balance, expensePercentage, byCategory]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        totalIncome: { type: integer, format: int64 }
        totalExpense: { type: integer, format: int64 }
        creditExpense: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        expensePercentage: { type: number }
        byCategory: { type: object, additionalProperties: { type: integer, format: int64 } }
    ProjectionMonth:
      type: object
      required: [month, income, expense, creditExpense, extraExpense, balance, accumulated]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        creditExpense: { type: integer, format: int64 }
        extraExpense: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        accumulated: { type: integer, format: int64 }
    CategoryTotal:
      type: object
      required: [category, value]
      properties:
        category: { type: string }
        value: { type: integer, format: int64 }
    Comparison:
      type: object
      required: [months, income, expense, balance, topCategory, ranking]
      properties:
        months: { type: array, items: { $ref: "#/components/schemas/MonthSummary" } }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        topCategory:
          allOf: [{ $ref: "#/components/schemas/CategoryTotal" }]
          nullable: true
        ranking: { type: array, description: Meses do melhor para o pior saldo, items: { $ref: "#/components/schemas/Month" } }
