openapi: 3.0.3
info:
  title: Aurora API
  version: 1.0.0
  description: |
    API do Aurora (controle financeiro pessoal). Contrato da Fase 7.

    - Todo dinheiro é em **centavos inteiros**. Meses são `"AAAA-MM"`.
    - O JSON de `/data` e dos recursos segue o `FinanceData` do front.
    - O token de acesso (JWT) vai no cabeçalho `Authorization: Bearer ...`; o refresh token
      fica num cookie `httpOnly` (`aurora_refresh`, path `/api/v1/auth`).
    - Nas criações, o cliente pode enviar o `id` (UUID). Se vier ausente ou inválido, o servidor gera um.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Cria a conta e abre a sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Conta criada, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      summary: Entra com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Sessão aberta, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: Muitas tentativas de login
          headers:
            Retry-After: { schema: { type: integer }, description: Segundos até poder tentar de novo }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Troca o refresh token (cookie) por um par novo
      security: []
      responses:
        "200": { description: Sessão renovada, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Encerra a sessão e limpa o cookie
      security: []
      responses:
        "204": { description: Sessão encerrada }
  /me:
    get:
      tags: [auth]
      summary: Usuário logado
      responses:
        "200": { description: Usuário, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Exclui a conta e todos os dados (LGPD). Exige a senha.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        "204": { description: Conta excluída; sessões encerradas }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/export:
    get:
      tags: [auth]
      summary: Exporta todos os dados da conta em JSON (LGPD)
      responses:
        "200": { description: Dados cadastrais e financeiros do titular, content: { application/json: { schema: { type: object, required: [exportedAt, user, data], properties: { exportedAt: { type: string, format: date-time }, user: { $ref: "#/components/schemas/User" }, data: { $ref: "#/components/schemas/FinanceData" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      tags: [auth]
      summary: Lista os usuários (só admin)
      responses:
        "200": { description: Usuários, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { $ref: "#/components/responses/Error" }

  /data:
    get:
      tags: [dados]
      summary: Tudo o que o usuário guarda
      responses:
        "200": { description: Dados, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceData" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /import:
    post:
      tags: [dados]
      summary: Importa os dados do localStorage
      description: Sem `replace=true`, responde 409 se a conta já tem dados.
      parameters:
        - { name: replace, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceData" }
      responses:
        "201": { description: Dados gravados, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceData" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /transactions:
    post:
      tags: [lançamentos]
      summary: Cria renda ou despesa
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /transactions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [lançamentos]
      summary: Altera só os campos enviados
      description: "`hiddenMonths`, `monthlyValues` e `monthlyNotes`, quando enviados, substituem a lista/mapa inteiro."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransactionPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lançamentos]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /credits:
    post:
      tags: [crédito]
      summary: Cria compra no crédito
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /credits/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [crédito]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /credit-cards:
    post:
      tags: [crédito]
      summary: Cadastra um cartão de crédito
      description: Só nome e dias de fechamento e vencimento. Nada sensível (sem número, CVV nem CPF).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /credit-cards/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [crédito]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditCardPatch" } } }
      responses:
        "200": { description: Atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Remove o cartão
      description: As compras ligadas a ele ficam sem cartão (voltam a valer no mês da cobrança); nenhuma compra é apagada.
      responses:
        "204": { description: Removido }
        "404": { $ref: "#/components/responses/Error" }

  /credits/{id}/installments/{n}/advance:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/InstallmentNumber" }
    post:
      tags: [crédito]
      summary: Adianta a última parcela da compra
      description: |
        Só a última parcela ainda não adiantada (nem excluída), e só se cair depois do mês atual.
        O valor da parcela menos o desconto passa a ser cobrado no mês atual e a parcela deixa o mês original.
        O desconto vai de zero até menos que o valor da parcela. Quem valida é o servidor.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [discount], properties: { discount: { $ref: "#/components/schemas/Cents" } } } } }
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /credits/{id}/installments/{n}/value:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/InstallmentNumber" }
    delete:
      tags: [crédito]
      summary: Tira o valor real de um mês de recorrência variável
      description: O mês volta ao valor estimado. Só recorrências de valor variável.
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /credits/{id}/installments/{n}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/InstallmentNumber" }
    put:
      tags: [crédito]
      summary: Muda só o valor de uma parcela
      description: Parcelas adiantadas ou excluídas não podem ser alteradas. Em recorrência de valor variável, define o valor real daquele mês (n é o mês contado desde o início).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [value], properties: { value: { $ref: "#/components/schemas/Cents" } } } } }
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [crédito]
      summary: Exclui só uma parcela
      description: As outras parcelas mantêm número e mês. Parcelas adiantadas não podem ser excluídas.
      responses:
        "200": { description: Compra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CreditTransaction" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

    post:
      tags: [metas]
      summary: Cria meta
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /goals/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [metas]
      summary: Altera só os campos enviados
      description: '`"deadline": null` limpa o prazo; sem a chave, o prazo não muda.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GoalPatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [metas]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /transactions/{id}/payments/{month}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/PaymentMonth" }
    put:
      tags: [lançamentos]
      summary: Marca a despesa como paga neste mês (ou edita o pagamento)
      description: Só registro para consulta e relatórios; não muda nenhum valor, resumo, projeção ou comparação. Despesa avulsa só vale no próprio mês; fixa, do mês inicial em diante. Renda não tem pagamento.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
      responses:
        "200": { description: Lançamento atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lançamentos]
      summary: Desmarca o pagamento deste mês
      responses:
        "200": { description: Lançamento atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /extra-expenses/{id}/payment:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [projeção]
      summary: Marca a despesa extra como paga (ou edita o pagamento)
      description: Só registro para consulta e relatórios; não muda nenhum valor.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
      responses:
        "200": { description: Despesa extra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projeção]
      summary: Desmarca o pagamento
      responses:
        "200": { description: Despesa extra atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /extra-expenses:
    post:
      tags: [projeção]
      summary: Cria despesa extra planejada
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /extra-expenses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [projeção]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpensePatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/ExtraExpense" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projeção]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /notes:
    post:
      tags: [anotações]
      summary: Cria anotação
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [anotações]
      summary: Altera só os campos enviados
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotePatch" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [anotações]
      summary: Remove
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }

  /categories:
    post:
      tags: [configurações]
      summary: Cria categoria própria
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomCategory" } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { $ref: "#/components/schemas/CustomCategory" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /categories/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [configurações]
      summary: Remove categoria própria
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Error" }
  /settings/distribution:
    put:
      tags: [configurações]
      summary: Define a distribuição do saldo
      description: "`items: null` volta ao padrão."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  nullable: true
                  items: { $ref: "#/components/schemas/DistributionItem" }
      responses:
        "204": { description: Salvo }
        "400": { $ref: "#/components/responses/Error" }
  /settings/seen-alerts:
    put:
      tags: [configurações]
      summary: Lista completa dos avisos de meta já vistos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, maxItems: 1000, items: { type: string } }
      responses:
        "204": { description: Salvo }
        "400": { $ref: "#/components/responses/Error" }

  /settings/onboarding/{screen}:
    put:
      tags: [configurações]
      summary: Registra a resposta do usuário ao tour de uma tela
      description: Muda só a tela informada; as outras respostas ficam como estão.
      parameters:
        - { name: screen, in: path, required: true, description: "Identificador da tela, ex. painel", schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: "#/components/schemas/OnboardingState" }
      responses:
        "204": { description: Salvo }
        "400": { $ref: "#/components/responses/Error" }

  /summary/{month}:
    get:
      tags: [relatórios]
      summary: Resumo do mês
      description: "Fica em cache no Redis; o cabeçalho `X-Cache` mostra HIT ou MISS."
      parameters:
        - { name: month, in: path, required: true, schema: { $ref: "#/components/schemas/Month" } }
      responses:
        "200":
          description: Resumo
          headers:
            X-Cache: { schema: { type: string, enum: [HIT, MISS] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/MonthSummary" } } }
        "400": { $ref: "#/components/responses/Error" }
  /projection:
    get:
      tags: [relatórios]
      summary: Projeção mês a mês
      parameters:
        - { name: start, in: query, description: "Padrão: mês atual", schema: { $ref: "#/components/schemas/Month" } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
      responses:
        "200": { description: Projeção, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectionMonth" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /comparison:
    get:
      tags: [relatórios]
      summary: Compara de 2 a 12 meses
      parameters:
        - { name: months, in: query, required: true, description: "Meses separados por vírgula", schema: { type: string, example: "2026-01,2026-02" } }
      responses:
        "200": { description: Comparação, content: { application/json: { schema: { $ref: "#/components/schemas/Comparison" } } } }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentMonth: { name: month, in: path, required: true, description: Mês do pagamento (AAAA-MM), schema: { $ref: "#/components/schemas/Month" } }
    InstallmentNumber: { name: n, in: path, required: true, description: Posição da parcela na compra (1 a N), schema: { type: integer, minimum: 1, maximum: 360 } }

  responses:
    Error:
      description: Erro
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Mensagem pronta para exibir }
    Month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-03" }
    Cents: { type: integer, format: int64, minimum: 0, description: Valor em centavos }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
    Session:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    Transaction:
      type: object
      required: [name, amount, type, category, month]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        notes: { type: string, maxLength: 500 }
        fixed: { type: boolean }
        month: { $ref: "#/components/schemas/Month" }
        hiddenMonths: { type: array, items: { $ref: "#/components/schemas/Month" } }
        monthlyValues: { type: object, additionalProperties: { $ref: "#/components/schemas/Cents" } }
        monthlyNotes: { type: object, description: "Fixas: observação de um mês (só vale nele; `notes` vale no mês de criação).", additionalProperties: { type: string } }
        payments:
          type: object
          description: Pagamento por mês (AAAA-MM). Só despesas. Só registro, não entra em nenhuma conta. Na criação o servidor ignora; entra na importação.
          additionalProperties: { $ref: "#/components/schemas/Payment" }
    Payment:
      type: object
      required: [method, date]
      properties:
        method: { type: string, enum: [pix, debit, credit, boleto] }
        date: { type: string, format: date, description: "Dia do pagamento (AAAA-MM-DD). Só boleto pode ter data futura (pagamento agendado); Pix e cartão com data futura são recusados." }
        notes: { type: string, maxLength: 500 }
    TransactionPatch:
      type: object
      properties:
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        category: { type: string }
        notes: { type: string }
        fixed: { type: boolean }
        hiddenMonths: { type: array, items: { $ref: "#/components/schemas/Month" } }
        monthlyValues: { type: object, additionalProperties: { $ref: "#/components/schemas/Cents" } }
        monthlyNotes: { type: object, description: "Fixas: observação de um mês (só vale nele; `notes` vale no mês de criação).", additionalProperties: { type: string } }

    CreditTransaction:
      type: object
      required: [name, totalAmount, installments, startMonth, category]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        totalAmount: { $ref: "#/components/schemas/Cents" }
        installments: { type: integer, minimum: 1, maximum: 360 }
        startMonth: { $ref: "#/components/schemas/Month" }
        category: { type: string }
        adjustments:
          type: object
          description: Ajustes por parcela, pela posição ("1" a "N"). Só leitura na criação (o servidor ignora); entra na importação.
          additionalProperties: { $ref: "#/components/schemas/InstallmentAdjustment" }
        recurring:
          type: boolean
          description: Compra recorrente (assinatura no cartão). totalAmount é o valor cobrado todo mês a partir de startMonth; installments fica em 1.
        endMonth:
          $ref: "#/components/schemas/Month"
          description: Último mês cobrado de uma recorrente cancelada. Só leitura na criação (o servidor ignora); entra na importação.
        billingDay: { type: integer, minimum: 1, maximum: 31, description: Dia da cobrança. Com cartão, define em qual fatura a cobrança cai. }
        cardId:
          type: string
          format: uuid
          description: Cartão da compra. Com cartão, o valor entra no mês do vencimento da fatura; sem, no mês da cobrança.
        variableAmount:
          type: boolean
          description: Só recorrentes. totalAmount é uma estimativa; o valor real de cada mês fica em adjustments["n"].value.
    CreditCard:
      type: object
      required: [name, closingDay, dueDay]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
    CreditCardPatch:
      type: object
      properties:
        name: { type: string }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
    InstallmentAdjustment:
      type: object
      properties:
        value: { $ref: "#/components/schemas/Cents", description: Valor só desta parcela }
        removed: { type: boolean, description: Só esta parcela foi excluída }
        advanced:
          type: object
          required: [month, discount, amount]
          properties:
            month: { $ref: "#/components/schemas/Month", description: Mês em que o valor adiantado é cobrado }
            discount: { $ref: "#/components/schemas/Cents" }
            amount: { $ref: "#/components/schemas/Cents", description: Valor da parcela menos o desconto }
    CreditPatch:
      type: object
      properties:
        name: { type: string }
        totalAmount: { $ref: "#/components/schemas/Cents" }
        installments: { type: integer, minimum: 1, maximum: 360 }
        startMonth: { $ref: "#/components/schemas/Month" }
        category: { type: string }
        endMonth:
          $ref: "#/components/schemas/Month"
          description: Cancela a recorrência (só compras recorrentes). É o último mês cobrado; o servidor nunca o põe antes do mês atual.
        billingDay: { type: integer, minimum: 1, maximum: 31 }
        cardId: { type: string, description: 'Troca o cartão; "" solta a compra do cartão.' }
        variableAmount: { type: boolean }

    Goal:
      type: object
      required: [name, target, saved, monthly, deadline]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        target: { $ref: "#/components/schemas/Cents" }
        saved: { $ref: "#/components/schemas/Cents" }
        monthly: { $ref: "#/components/schemas/Cents" }
        deadline: { allOf: [{ $ref: "#/components/schemas/Month" }], nullable: true }
        yieldTotal: { $ref: "#/components/schemas/Cents" }
        piggy:
          type: boolean
          description: Porquinho. Não exige valor de meta (target pode ser 0); meta comum exige target maior que zero. Não muda depois de criado.
    GoalPatch:
      type: object
      properties:
        name: { type: string }
        target: { $ref: "#/components/schemas/Cents" }
        saved: { $ref: "#/components/schemas/Cents" }
        monthly: { $ref: "#/components/schemas/Cents" }
        yieldTotal: { $ref: "#/components/schemas/Cents" }
        deadline: { allOf: [{ $ref: "#/components/schemas/Month" }], nullable: true }

    ExtraExpense:
      type: object
      required: [name, amount, month]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        month: { $ref: "#/components/schemas/Month" }
        payment: { $ref: "#/components/schemas/Payment", description: Pagamento da despesa (só registro). Na criação o servidor ignora; entra na importação. }
    ExtraExpensePatch:
      type: object
      properties:
        name: { type: string }
        amount: { $ref: "#/components/schemas/Cents" }
        month: { $ref: "#/components/schemas/Month" }

    Note:
      type: object
      required: [content, date, pinned, month]
      properties:
        id: { type: string, format: uuid }
        content: { type: string, maxLength: 2000 }
        date: { type: string }
        pinned: { type: boolean }
        month: { $ref: "#/components/schemas/Month" }
    NotePatch:
      type: object
      properties:
        content: { type: string }
        date: { type: string }
        pinned: { type: boolean }
        month: { $ref: "#/components/schemas/Month" }

    CustomCategory:
      type: object
      required: [name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }

    DistributionItem:
      type: object
      required: [id, label, percent]
      properties:
        id: { type: string }
        label: { type: string }
        percent: { type: integer, minimum: 0, maximum: 100 }
        custom: { type: boolean }

    OnboardingState:
      type: string
      enum: [done, dismissed]
      description: "done = viu o tour até o fim; dismissed = recusou o convite, fechou ou pulou"
    FinanceData:
      type: object
      required: [transactions, creditTransactions, notes, goals, extraExpenses, customCategories, distribution, seenAlerts, onboarding]
      properties:
        transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        creditTransactions: { type: array, items: { $ref: "#/components/schemas/CreditTransaction" } }
        creditCards: { type: array, items: { $ref: "#/components/schemas/CreditCard" } }
        notes: { type: array, items: { $ref: "#/components/schemas/Note" } }
        goals: { type: array, items: { $ref: "#/components/schemas/Goal" } }
        extraExpenses: { type: array, items: { $ref: "#/components/schemas/ExtraExpense" } }
        customCategories: { type: array, items: { $ref: "#/components/schemas/CustomCategory" } }
        distribution:
          type: array
          nullable: true
          description: Percentuais escolhidos; null = padrão
          items: { $ref: "#/components/schemas/DistributionItem" }
        seenAlerts: { type: array, items: { type: string } }
        onboarding:
          type: object
          description: Resposta ao tour de cada tela (chave = tela). Tela ausente = ainda não convidado.
          additionalProperties: { $ref: "#/components/schemas/OnboardingState" }

    MonthSummary:
      type: object
      required: [month, totalIncome, totalExpense, creditExpense, balance, expensePercentage, byCategory]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        totalIncome: { type: integer, format: int64 }
        totalExpense: { type: integer, format: int64 }
        creditExpense: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        expensePercentage: { type: number }
        byCategory: { type: object, additionalProperties: { type: integer, format: int64 } }
    ProjectionMonth:
      type: object
      required: [month, income, expense, creditExpense, extraExpense, balance, accumulated]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        creditExpense: { type: integer, format: int64 }
        extraExpense: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        accumulated: { type: integer, format: int64 }
    CategoryTotal:
      type: object
      required: [category, value]
      properties:
        category: { type: string }
        value: { type: integer, format: int64 }
    Comparison:
      type: object
      required: [months, income, expense, balance, topCategory, ranking]
      properties:
        months: { type: array, items: { $ref: "#/components/schemas/MonthSummary" } }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        topCategory:
          allOf: [{ $ref: "#/components/schemas/CategoryTotal" }]
          nullable: true
        ranking: { type: array, description: Meses do melhor para o pior saldo, items: { $ref: "#/components/schemas/Month" } }
