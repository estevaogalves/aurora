# Uso pessoal local. Use junto do compose principal:
#   docker compose -f docker-compose.yml -f docker-compose.personal.yml up -d --build
# (scripts/aurora-iniciar.bat faz isso.)
#
# - Publica o Postgres só em loopback, para o DBeaver conectar em localhost:5432.
# - restart "no": nada sobe sozinho quando o Docker Desktop abre; só quando você inicia o Aurora.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: "no"
  redis:
    restart: "no"
  api:
    restart: "no"
  web:
    restart: "no"
