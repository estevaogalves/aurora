# Aurora: Postgres, Redis, API (Go) e web (nginx).
#   docker compose up --build        -> http://localhost:8080 (web) e http://localhost:8081 (API direta)
# Variáveis podem vir de um arquivo .env na raiz (veja .env.example).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurora} -d ${POSTGRES_DB:-aurora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      API_ADDR: ":8080"
      # Para usar outro banco (Postgres no host, Supabase...), defina DATABASE_URL no .env
      # e suba sem os containers de banco: docker compose up --build --no-deps api web.
      # O padrão acompanha os valores padrão de POSTGRES_*: se mudá-los, defina DATABASE_URL também.
      DATABASE_URL: ${DATABASE_URL:-postgres://aurora:aurora@postgres:5432/aurora?sslmode=disable}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # obrigatório, sem valor padrão: gere com `openssl rand -hex 32` (ou `make env`) e ponha no .env
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      # produção (padrão): HTTPS e cookie Secure. Em desenvolvimento local, o .env define APP_ENV=development e COOKIE_SECURE=false.
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # A API só é alcançável pelo nginx (que sobrescreve X-Real-IP): ler o IP do cliente dele.
      # Sem isso todos os usuários teriam o IP do nginx e os limites por IP viram globais.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Hashing de senha (argon2id, 64 MiB por hash): concorrência calculada pelo limite de memória do
      # container (API_MEM_LIMIT); fila com timeout; 503 quando lota. Vazio = automático/padrão.
      HASH_MAX_CONCURRENCY: ${HASH_MAX_CONCURRENCY:-}
      HASH_MAX_QUEUE: ${HASH_MAX_QUEUE:-}
      HASH_QUEUE_TIMEOUT: ${HASH_QUEUE_TIMEOUT:-}
      # Cadastros por IP na janela (429 ao passar)
      REGISTER_MAX_PER_IP: ${REGISTER_MAX_PER_IP:-}
      REGISTER_WINDOW: ${REGISTER_WINDOW:-}
    # permite alcançar um Postgres/Redis que rodam na própria máquina (host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # base do cálculo de quantos hashes de senha podem rodar juntos (40% disso / 64 MiB por hash)
    mem_limit: ${API_MEM_LIMIT:-512m}
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
